version: '3.8'

services:
  app:
    build: .
    container_name: curso_node_app
    restart: always
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: curso_node_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=ts_curso
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
